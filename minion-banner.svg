<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BFE1FF"/>
      <stop offset="100%" stop-color="#1E6FEB"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FDD835"/>
    </radialGradient>
  </defs>

  <rect width="900" height="230" rx="24" fill="url(#bg)"/>

  <!-- Minion character -->
  <g transform="translate(60,20)">
    <!-- legs -->
    <rect x="25" y="175" width="18" height="22" rx="4" fill="#2B2B2B"/>
    <rect x="85" y="175" width="18" height="22" rx="4" fill="#2B2B2B"/>

    <!-- body capsule -->
    <rect x="10" y="20" width="120" height="160" rx="60" fill="url(#bodyGrad)" stroke="#C9A200" stroke-width="2"/>

    <!-- overall -->
    <path d="M10,120 Q70,100 130,120 L130,165 Q70,180 10,165 Z" fill="#103A7A" stroke="#092450" stroke-width="2"/>
    <rect x="55" y="125" width="20" height="16" rx="2" fill="#092450"/>

    <!-- goggle band -->
    <rect x="0" y="62" width="140" height="22" fill="#2B2B2B"/>

    <!-- goggle -->
    <circle cx="70" cy="73" r="30" fill="#DADADA" stroke="#2B2B2B" stroke-width="4"/>
    <circle cx="70" cy="73" r="22" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
    <g>
      <circle cx="70" cy="73" r="11" fill="#5B3A29"/>
      <circle cx="74" cy="69" r="3" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -7,2; 7,-2; 0,0" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- mouth -->
    <path d="M50,105 Q70,122 92,103" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>

    <!-- hair tufts -->
    <path d="M40,22 Q45,5 50,20" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
    <path d="M55,18 Q60,2 65,18" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <g font-family="'Trebuchet MS', Verdana, sans-serif">
    <text x="280" y="95" font-size="34" font-weight="bold" fill="#0A2E6E" opacity="0">Hi, I'm Matthias Huss
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="280" y="135" font-size="20" fill="#FFFFFF" opacity="0">Hello! Welcome to my GitHub...
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze"/>
    </text>
    <text x="280" y="180" font-size="19" font-style="italic" font-weight="bold" fill="#0A2E6E" opacity="0">"Turning technology into business impact"
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.6s" fill="freeze"/>
    </text>
  </g>
</svg>
